<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevStudio FC Clips</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  {% include "_topbar.html" %}

  <main>
    <div class="page-head">
      <div>
        <h1>Tus VODs</h1>
        <p id="sync-line">Cargando…</p>
      </div>
      <div class="row">
        <button class="btn" id="btn-sync">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          Actualizar
        </button>
        <button class="btn" id="btn-folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          Carpeta de clips
        </button>
      </div>
    </div>

    <div id="notices"></div>
    <div class="vods" id="vods"></div>
  </main>

  <dialog class="player" id="player">
    <video id="player-video" controls playsinline></video>
    <div class="bar">
      <strong id="player-title"></strong>
      <span class="spacer"></span>
      <a class="btn sm" id="player-download" href="#">Descargar</a>
      <button class="btn sm ghost" id="player-close">Cerrar</button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='common.js') }}"></script>
  <script src="{{ url_for('static', filename='panel.js') }}"></script>
</body>
</html>
